<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Avaliação</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .calculadora-card {
            position: relative;
            background-color: #2563eb;
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Sistema de Abas Superiores */
        .tabs-nav {
            display: flex;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        /* Quando a aba Presencial estiver selecionada (Verde Limão) */
        #tabBtnPresencial.ativo {
            background-color: #c4d82d;
            color: #0b1d3a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Quando a aba EAD e SEMI estiver selecionada (Verde Limão) */
        #tabBtnEad.ativo {
            background-color: #c4d82d;
            color: #0b1d3a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .tab-conteudo {
            display: none;
        }

        .tab-conteudo.ativo {
            display: block;
        }

        /* Toast Popup */
        .toast-popup {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0b2c5e;
            color: #ffffff;
            border: 2px solid #fef08a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: top 0.4s ease-in-out, opacity 0.4s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            white-space: normal;
            max-width: 85%;
        }

        .toast-popup.ativo {
            top: 12px;
            opacity: 1;
        }

        h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 19px;
        }

        .secao-peso {
            position: relative;
            padding-left: 14px;
            margin-bottom: 15px;
        }

        .secao-ag { border-left: 5px solid #c4d82d; }
        .secao-ai { border-left: 5px solid #0b2c5e; }

        .peso-label {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .porcentagem-tag {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 800;
        }

        .secao-ag .porcentagem-tag { background-color: #c4d82d; color: #0b1d3a; }
        .secao-ai .porcentagem-tag { background-color: #0b2c5e; color: #ffffff; }

        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .badge-ag {
            background-color: #c4d82d;
            color: #0b1d3a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            margin-right: 5px;
        }

        .badge-ai {
            background-color: #0b2c5e;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            margin-right: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 600;
            color: #0b1d3a;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #c4d82d;
            box-shadow: 0 0 0 2px rgba(196, 216, 45, 0.4);
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
            font-weight: normal;
        }

        .resumo-box {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            color: #ffffff;
            margin-top: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .resumo-box strong { font-size: 17px; color: #ffffff; }

        .mascote-container {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 10px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mascote-img {
            max-height: 110px;
            object-fit: contain;
        }

        #outResposta {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            display: none;
        }

        .alerta-sucesso { background-color: #c4d82d; color: #0b1d3a; border: 1px solid #a8ba21; }
        .alerta-erro { background-color: #fecdd3; color: #881337; border: 1px solid #fda4af; }
        .alerta-aviso { background-color: #fef08a; color: #713f12; border: 1px solid #fde047; }
    </style>
</head>
<body>

    <div class="calculadora-card">
        <div id="toastPopup" class="toast-popup"></div>

        <!-- Abas de Seleção da Modalidade -->
        <div class="tabs-nav">
            <button class="tab-btn ativo" id="tabBtnPresencial" onclick="trocarAba('presencial')">Presencial</button>
            <button class="tab-btn" id="tabBtnEad" onclick="trocarAba('ead')">EAD / SEMI</button>
        </div>

        <h2>Calculadora do processo avaliativo</h2>
        
        <!-- Formulário Presencial -->
        <div id="abaPresencial" class="tab-conteudo ativo">
            <div class="secao-peso secao-ag">
                <div class="peso-label">
                    Projeto <span class="porcentagem-tag">60%</span>
                </div>
                <div class="form-group">
                    <label><span class="badge-ag">AG</span> Fase 1 (Máx 3.0 pontos):</label>
                    <input type="text" id="inPresP1" placeholder="0.0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label><span class="badge-ag">AG</span> Fase 2 (Máx 3.0 pontos):</label>
                    <input type="text" id="inPresP2" placeholder="0.0" inputmode="decimal">
                </div>
            </div>
            
            <div class="secao-peso secao-ai">
                <div class="peso-label">
                    Avaliação Individual <span class="porcentagem-tag">40%</span>
                </div>
                <div class="form-group">
                    <label><span class="badge-ai">AI</span> Avaliação Individual (Máx 4.0 pontos):</label>
                    <input type="text" id="inPresAi" placeholder="0.0" inputmode="decimal">
                </div>
            </div>
        </div>

        <!-- Formulário EAD e SEMI (3 etapas para AG) -->
        <div id="abaEad" class="tab-conteudo">
            <div class="secao-peso secao-ag">
                <div class="peso-label">
                    Projeto <span class="porcentagem-tag">60%</span>
                </div>
                <div class="form-group">
                    <label><span class="badge-ag">AG</span> Fase 1 (Máx 2.0 pontos - 20%):</label>
                    <input type="text" id="inEadP1" placeholder="0.0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label><span class="badge-ag">AG</span> Fase 2 (Máx 2.0 pontos - 20%):</label>
                    <input type="text" id="inEadP2" placeholder="0.0" inputmode="decimal">
                </div>
                <div class="form-group">
                    <label><span class="badge-ai">AI</span> Avaliação individual no projeto (Máx 2.0 pontos - 20%):</label>
                    <input type="text" id="inEadPart" placeholder="0.0" inputmode="decimal">
                </div>
            </div>
            
            <div class="secao-peso secao-ai">
                <div class="peso-label">
                    Avaliação Individual <span class="porcentagem-tag">40%</span>
                </div>
                <div class="form-group">
                    <label><span class="badge-ai">AI</span> Atividades Individuais (Máx 4.0 pontos - 40%):</label>
                    <input type="text" id="inEadAi" placeholder="0.0" inputmode="decimal">
                </div>
            </div>
        </div>

        <div class="resumo-box">
            <span>AG Total: <strong id="outAg">0.00</strong></span>
            <span>Nota Atual: <strong id="outTotal">0.00</strong></span>
        </div>

        <div id="outResposta"></div>

        <div class="mascote-container">
            <img id="imgMascote" class="mascote-img" src="assets/Neutro.png" alt="Mascote Institucional">
        </div>
    </div>

    <script>
        var modoAtual = 'presencial';

        // Elementos Presencial
        var inPresP1 = document.getElementById("inPresP1");
        var inPresP2 = document.getElementById("inPresP2");
        var inPresAi = document.getElementById("inPresAi");

        // Elementos EAD / SEMI (3 campos de AG + 1 de AI)
        var inEadP1   = document.getElementById("inEadP1");
        var inEadP2   = document.getElementById("inEadP2");
        var inEadPart = document.getElementById("inEadPart");
        var inEadAi   = document.getElementById("inEadAi");
        
        var outAg = document.getElementById("outAg");
        var outTotal = document.getElementById("outTotal");
        var outResposta = document.getElementById("outResposta");
        var imgMascote = document.getElementById("imgMascote");
        var toastPopup = document.getElementById("toastPopup");

        var MASCOTES = {
            neutro: "assets/Neutro.png",
            feliz: "assets/Aprovado.png",
            preocupado: "assets/Final.png",
            chorando: "assets/Reprovado.png"
        };

        var timeoutToast = null;

        function exibirToast(mensagem) {
            toastPopup.textContent = mensagem;
            toastPopup.classList.add("ativo");

            clearTimeout(timeoutToast);
            timeoutToast = setTimeout(function() {
                toastPopup.classList.remove("ativo");
            }, 3000);
        }

        function formatarNota(valor) {
            if (valor === null || isNaN(valor)) return "0";
            var notaFixa = parseFloat(valor.toFixed(2));
            return (notaFixa % 1 === 0) ? notaFixa.toFixed(0) : notaFixa.toString().replace('.', ',');
        }

        function trocarAba(modo) {
            modoAtual = modo;
            
            document.getElementById("tabBtnPresencial").classList.toggle("ativo", modo === 'presencial');
            document.getElementById("tabBtnEad").classList.toggle("ativo", modo === 'ead');
            document.getElementById("abaPresencial").classList.toggle("ativo", modo === 'presencial');
            document.getElementById("abaEad").classList.toggle("ativo", modo === 'ead');

            if (modo === 'presencial') {
                inEadP1.value = "";
                inEadP2.value = "";
                inEadPart.value = "";
                inEadAi.value = "";
                calcularPresencial();
            } else {
                inPresP1.value = "";
                inPresP2.value = "";
                inPresAi.value = "";
                calcularEad();
            }
        }

        function filtrarEntrada(input) {
            if (/[^0-9.,]/.test(input.value)) {
                exibirToast("⚠️ Apenas números e vírgula/ponto são permitidos!");
            }

            input.value = input.value.replace(/[^0-9.,]/g, '');
            
            var partes = input.value.split(/[,.]/);
            if (partes.length > 2) {
                input.value = partes[0] + '.' + partes.slice(1).join('');
            }
        }

        function processarResultado(ag, ai, camposCompletos) {
            var agTotal = ag || 0;
            var notaFinal = agTotal + (ai || 0);

            outAg.textContent = formatarNota(agTotal);
            outTotal.textContent = formatarNota(notaFinal);

            if (!camposCompletos) {
                outResposta.style.display = "none";
                outResposta.className = "";
                imgMascote.src = MASCOTES.neutro;
                return;
            }

            outResposta.style.display = "block";
            outResposta.className = "";

            if (notaFinal >= 7.0) {
                outResposta.innerHTML = "<strong>Aprovado!</strong> Parabéns, sua nota final é <strong>" + formatarNota(notaFinal) + "</strong>.";
                outResposta.classList.add("alerta-sucesso");
                imgMascote.src = MASCOTES.feliz;
                
            } else if (agTotal < 4.0) {
                outResposta.innerHTML = "<strong>Reprovado!</strong> Sua média é menor que 7,0 e o Projeto menor que 4,0, ou seja, não é possível realizar Avaliação Final.";
                outResposta.classList.add("alerta-erro");
                imgMascote.src = MASCOTES.chorando;
                
            } else {
                var notaNecessariaFinal = Math.max(6.0 - agTotal, 0.1);

                if (notaNecessariaFinal > 4.0) {
                    outResposta.innerHTML = "<strong>Reprovado.</strong> Você precisaria de " + formatarNota(notaNecessariaFinal) + " na Avaliação Final, mas a prova vale no máximo 4,0.";
                    outResposta.classList.add("alerta-erro");
                    imgMascote.src = MASCOTES.chorando;
                } else {
                    var textoPonto = (notaNecessariaFinal === 1) ? "ponto" : "pontos";

                    outResposta.innerHTML = "<strong>Avaliação Final!</strong> Sua média atual é <strong>" + formatarNota(notaFinal) + "</strong>, mas o Projeto = <strong>" + formatarNota(agTotal) + "</strong>, ou seja, pode fazer a Final precisando de, pelo menos, <strong>" + formatarNota(notaNecessariaFinal) + " " + textoPonto + "</strong>.";
                    outResposta.classList.add("alerta-aviso");
                    imgMascote.src = MASCOTES.preocupado;
                }
            }
        }

        // Cálculo Modalidade Presencial
        function calcularPresencial(inputAtual) {
            if (inputAtual) filtrarEntrada(inputAtual);

            var vP1 = inPresP1.value.trim().replace(',', '.');
            var vP2 = inPresP2.value.trim().replace(',', '.');
            var vAi = inPresAi.value.trim().replace(',', '.');

            var p1 = vP1 !== "" && !isNaN(vP1) ? parseFloat(vP1) : null;
            var p2 = vP2 !== "" && !isNaN(vP2) ? parseFloat(vP2) : null;
            var ai = vAi !== "" && !isNaN(vAi) ? parseFloat(vAi) : null;

            if (p1 !== null && p1 > 3.0) { p1 = null; inPresP1.value = ""; exibirToast("⚠️ Nota superior à nota máxima (3.0) permitida nesta etapa!"); }
            if (p2 !== null && p2 > 3.0) { p2 = null; inPresP2.value = ""; exibirToast("⚠️ Nota superior à nota máxima (3.0) permitida nesta etapa!"); }
            if (ai !== null && ai > 4.0) { ai = null; inPresAi.value = ""; exibirToast("⚠️ Nota superior à nota máxima (4.0) permitida nesta etapa!"); }

            var ag = (p1 || 0) + (p2 || 0);
            var camposCompletos = (p1 !== null && p2 !== null && ai !== null);
            processarResultado(ag, ai, camposCompletos);
        }

        // Cálculo Modalidade EAD e SEMI
        function calcularEad(inputAtual) {
            if (inputAtual) filtrarEntrada(inputAtual);

            var vP1   = inEadP1.value.trim().replace(',', '.');
            var vP2   = inEadP2.value.trim().replace(',', '.');
            var vPart = inEadPart.value.trim().replace(',', '.');
            var vAi   = inEadAi.value.trim().replace(',', '.');

            var p1   = vP1   !== "" && !isNaN(vP1)   ? parseFloat(vP1)   : null;
            var p2   = vP2   !== "" && !isNaN(vP2)   ? parseFloat(vP2)   : null;
            var part = vPart !== "" && !isNaN(vPart) ? parseFloat(vPart) : null;
            var ai   = vAi   !== "" && !isNaN(vAi)   ? parseFloat(vAi)   : null;

            if (p1   !== null && p1   > 2.0) { p1   = null; inEadP1.value   = ""; exibirToast("⚠️ Nota superior à nota máxima (2.0) permitida para a Fase 1!"); }
            if (p2   !== null && p2   > 2.0) { p2   = null; inEadP2.value   = ""; exibirToast("⚠️ Nota superior à nota máxima (2.0) permitida para a Fase 2!"); }
            if (part !== null && part > 2.0) { part = null; inEadPart.value = ""; exibirToast("⚠️ Nota superior à nota máxima (2.0) permitida para a Avaliação Individual no Projeto!"); }
            if (ai   !== null && ai   > 4.0) { ai   = null; inEadAi.value   = ""; exibirToast("⚠️ Nota superior à nota máxima (4.0) permitida nesta etapa!"); }

            var ag = (p1 || 0) + (p2 || 0) + (part || 0);
            var camposCompletos = (p1 !== null && p2 !== null && part !== null && ai !== null);
            processarResultado(ag, ai, camposCompletos);
        }

        // Eventos Presencial
        inPresP1.oninput = function() { calcularPresencial(this); };
        inPresP2.oninput = function() { calcularPresencial(this); };
        inPresAi.oninput = function() { calcularPresencial(this); };

        // Eventos EAD e SEMI
        inEadP1.oninput   = function() { calcularEad(this); };
        inEadP2.oninput   = function() { calcularEad(this); };
        inEadPart.oninput = function() { calcularEad(this); };
        inEadAi.oninput   = function() { calcularEad(this); };
    </script>
</body>
</html>
